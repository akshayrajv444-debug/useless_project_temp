<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzhunnuvada Detector API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-top: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }
        input[type="file"] {
            display: none;
        }
        .results {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .image-container {
            width: 100%;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .image-container img {
            max-width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-card span {
            display: block;
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .stat-card strong {
            font-size: 1.25rem;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Uzhunnuvada Detector</h1>
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <svg style="width:48px;height:48px;color:#94a3b8;margin-bottom:1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p>Click or drag image to upload</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div style="margin-top: 1.5rem; text-align: center;">
            <label for="scaleInput" style="font-size: 0.9rem; color: #cbd5e1; margin-right: 0.5rem;">Image Scale (Pixels per cm):</label>
            <input type="number" id="scaleInput" value="100" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.5rem; border-radius: 0.5rem; width: 100px; text-align: center;">
            <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 0.5rem;">(Adjust this based on your camera resolution to get accurate cm²)</p>
        </div>
        
        <div class="results" id="results">
            <div class="image-container">
                <img id="resultImage" src="" alt="Detected Vada">
            </div>
            <div class="stats">
                <div class="stat-card" style="background: rgba(59, 130, 246, 0.1); border-color: var(--accent);">
                    <span style="color: #60a5fa;">Hole Radius (cm)</span>
                    <strong id="statRadiusCm" style="color: white;"></strong>
                </div>
                <div class="stat-card" style="background: rgba(59, 130, 246, 0.1); border-color: var(--accent);">
                    <span style="color: #60a5fa;">Hole Area (cm²)</span>
                    <strong id="statAreaCm" style="color: white;"></strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const results = document.getElementById('results');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--accent)';
        });
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                uploadFile(fileInput.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                uploadFile(e.target.files[0]);
            }
        });

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('pixels_per_cm', document.getElementById('scaleInput').value || 100);
            
            uploadArea.querySelector('p').innerText = 'Analyzing...';
            results.style.display = 'none';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('resultImage').src = 'data:image/jpeg;base64,' + data.image;
                    document.getElementById('statRadiusCm').innerText = `${data.data.radius_cm} cm`;
                    document.getElementById('statAreaCm').innerText = `${data.data.area_cm2} cm²`;
                    results.style.display = 'block';
                    uploadArea.querySelector('p').innerText = 'Upload another image';
                } else {
                    alert('Error: ' + data.error);
                    uploadArea.querySelector('p').innerText = 'Click or drag image to upload';
                }
            } catch (err) {
                console.error(err);
                alert('Upload failed');
                uploadArea.querySelector('p').innerText = 'Click or drag image to upload';
            }
        }
    </script>
</body>
</html>
